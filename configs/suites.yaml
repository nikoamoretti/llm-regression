product-grok:
  class: canary
  version: "v1"
  trials: 1
  efforts: [high]
  track: cursor_product
  tracks: [cursor_product]
  models: [grok-4.7]
  tasks: *product_tasks
  notes: >-
    The scheduled Cursor CLI product series (Grok 4.7 as Cursor serves it): the same tasks as
    `product`, run the same days, so the two products are compared on identical work.
