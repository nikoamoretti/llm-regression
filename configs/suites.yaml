demo:
  class: canary
  version: "v1"
  trials: 1
  efforts: [low, medium, high, xhigh]
  track: model_only
  tracks: [model_only, agentic]
  models: [grok-4.6, gpt-6-astra]
  tasks:
    - DEMO-PY-01
    - DEMO-PY-02
  notes: >-
    Two public demo tasks whose graders are committed on purpose, for CI and the unit tests. The
    benchmark tasks' hidden graders are not in this public repository (see private_graders/README.md).

canary:
  class: canary
  version: "v1"
  trials: 1
  efforts: [low, medium, high, xhigh]
  track: model_only
  tracks: [model_only, agentic]
  models: [grok-4.6, gpt-6-astra]
  tasks:
    - BUG-PY-01
    - BUG-TS-01
    - REF-PY-01
    - FEAT-TS-01
    - DATA-PY-01
    - SPEC-TS-01
    - BUILD-01
    - STATE-GO-01
    - NAV-RUST-01
    - LONG-01
  notes: Small, extremely validated frozen suite for frequent detection of obvious changes. Not powered for 5 pp estimates.

core:
  class: core
  version: "v1"
  trials: 3
  efforts: [low, medium, high, xhigh]
  track: model_only
  tracks: [model_only, agentic]
  models: [grok-4.6, gpt-6-astra]
  tasks:
    - BUG-PY-01
    - BUG-TS-01
    - REF-PY-01
    - FEAT-TS-01
    - DATA-PY-01
    - SPEC-TS-01
    - BUILD-01
    - STATE-GO-01
    - NAV-RUST-01
    - LONG-01
  notes: Initial immutable longitudinal suite. Expand only by adding new task versions; never rewrite v1.

shadow:
  class: shadow
  version: "v1"
  trials: 1
  efforts: [max]
  track: codex_product
  tasks: []
  notes: New task versions/families introduced over time. Never blended retrospectively into historical Core results.

