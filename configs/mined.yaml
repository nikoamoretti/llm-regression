# Tasks mined from bug-fix commits in private repositories (see runner/mine.py).
#
# Only the recipe is committed: the fixture, hidden tests and gold patch copy the
# source repository, so they are materialized locally and gitignored:
#
#   python -m runner mine --batch configs/mined.yaml --repos-dir ~/code
#
# Mining is deterministic. configs/mined.lock.json records each task's content
# hashes, and a batch run fails if a materialized task differs from them.
# Prompts are written as issue reports that state the contract the hidden tests
# check (names, error codes, schema shapes) without describing the fix.

defaults: &pytest
  repo: forecastlab
  functional_command: "python3 -m pytest -q -p no:cacheprovider {tests} --junitxml {junit}"
  requirements: uv_export
  review_notes: "Prompt drafted by Claude from the fix and its hidden tests; needs owner review."

tasks:
  - <<: *pytest
    id: MINE-FCL-01
    commit: 1c7fb94752b8180b721e643dbb40a8420fd27e4b
    prompt: mined/MINE-FCL-01.md
    difficulty: medium
