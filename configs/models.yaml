# Canonical model catalog for the dual-model longitudinal experiment.
# Compare only same model + same effort + same track + same task version.

models:
  grok-4.6:
    display_name: Grok 4.6
    provider: xai
    api_model: grok-4.6
    api_base_env: XAI_API_BASE
    default_api_base: https://api.x.ai/v1
    responses_path: /responses
    api_key_env: XAI_API_KEY
    comparison_efforts: [low, medium, high, xhigh]
    auxiliary_efforts: []
    send_sampling_params: true
    temperature: 0
    top_p: 1
    store: false
    tracks: [model_only, agentic]
    scientific: true

  gpt-6-astra:
    display_name: GPT-6 Astra
    provider: openai
    api_model: gpt-6-astra
    api_base_env: OPENAI_API_BASE
    default_api_base: https://api.openai.com/v1
    responses_path: /responses
    api_key_env: OPENAI_API_KEY
    api_key_env_aliases: [ASTRA_API_KEY]
    comparison_efforts: [low, medium, high, xhigh]
    auxiliary_efforts: [max]
    send_sampling_params: false
    store: false
    tracks: [model_only, agentic]
    scientific: true

optional_series:
  gpt-5.6-sol:
    display_name: GPT-5.6 Sol on Codex
    provider: codex_cli
    api_model: gpt-5.6-sol
    comparison_efforts: [low, medium, high, xhigh, max]
    auxiliary_efforts: [ultra]
    tracks: [codex_product]
    scientific: true
    note: Optional unblended product series. Never mix with Grok/Astra API series.

  claude-opus-5-5:
    display_name: Claude Opus 5.5 on Claude Code
    provider: claude_code_cli
    api_model: claude-opus-5-5
    comparison_efforts: [low, medium, high, xhigh]
    auxiliary_efforts: [max]
    tracks: [claude_code_product]
    scientific: true
    note: Optional unblended product series via Claude Code on a Claude subscription. Never mix with API or Codex series.

  grok-4.7:
    display_name: Grok 4.7 on Cursor
    provider: cursor_cli
    api_model: grok-4.7
    comparison_efforts: [low, medium, high, xhigh]
    auxiliary_efforts: []
    tracks: [cursor_product]
    scientific: true
    note: Optional unblended product series via the Cursor CLI on a Cursor plan. Never mix with API or other product series.
