[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-regression"
version = "3.0.0"
description = "Longitudinal regression harness for Grok 4.6 and GPT-6 Astra"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sol Regression" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
llm-regression = "runner.cli:main"
sol-regression = "runner.cli:main"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gold: gold-patch grader validation (no API)",
    "slow: longer deterministic stress checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen task trees are hashed; never lint (or cache) inside them.
extend-exclude = ["tasks", "private_graders"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
ignore = []
